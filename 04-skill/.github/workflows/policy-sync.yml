name: Dynamic Google Policy Sync

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Policy Sync Engine
        run: python scripts/sync_policies.py

      - name: Check for Policy Modifications
        id: git-check
        run: |
          git status --porcelain policies/
          if [ -n "$(git status --porcelain policies/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request with Updated Policies
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(policy): auto-sync with latest Google Publisher Policies"
          title: "🤖 Automated Google AdSense Policy Sync"
          body: |
            ## Automated Policy Update Detected
            Google has updated one or more Publisher Policy endpoints or Search Essentials documentation.
            
            This automated PR updates `policies/adsense_rules.json` and records the sync in `policies/changelog.json`.
            
            ### Actions Required:
            - Review the updated policy hashes and rules.
            - Merge to keep all AI agents aligned with latest Google standards.
          branch: auto-policy-sync
          delete-branch: true
